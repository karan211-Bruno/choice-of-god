<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fef7e5">
  <title>Choice of God v3.0 (신의 선택) — 동화풍 멀티 장르 성경 RPG</title>
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/styles.css">

  <script defer src="./js/i18n/ko.js"></script>
  <script defer src="./js/i18n/en.js"></script>
  <script defer src="./js/i18n/ja.js"></script>
  <script defer src="./js/i18n/es.js"></script>
  <script defer src="./js/i18n/zh.js"></script>

  <script defer src="./js/data/bible.js"></script>
  <script defer src="./js/data/guides.js"></script>
  <script defer src="./js/data/items.js"></script>
  <script defer src="./js/data/dialogues.js"></script>
  <script defer src="./js/data/stages.js"></script>

  <script defer src="./js/engine/i18n.js"></script>
  <script defer src="./js/engine/state.js"></script>
  <script defer src="./js/engine/audio.js"></script>
  <script defer src="./js/engine/chibiSprites.js"></script>
  <script defer src="./js/engine/stageHost.js"></script>

  <script defer src="./js/stages/stage1_eden_arpg.js"></script>
  <script defer src="./js/stages/stage2_ark_sim.js"></script>
  <script defer src="./js/stages/stage3_abraham_hex.js"></script>
  <script defer src="./js/stages/stage4_plagues_jrpg.js"></script>
  <script defer src="./js/stages/stage5_redsea_rts.js"></script>
  <script defer src="./js/stages/stage6_sinai_fps.js"></script>

  <script defer src="./js/ui/dialogs.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link visually-hidden">Skip to main content</a>
  <div id="live-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-cluster">
        <img class="brand-avatar" src="./assets/art/cherubim.png" alt="Cherubim Guardian">
        <div class="brand-text">
          <h1 id="brand-title" data-i18n="appTitle">Choice of God · 신의 선택</h1>
          <p class="brand-sub" data-i18n="appSubtitle">동화풍 성경 멀티 장르 어드벤처 RPG</p>
        </div>
      </div>

      <nav class="top-nav" aria-label="Primary Controls">
        <label for="lang-select" class="visually-hidden" data-i18n="ui.language">언어 변경</label>
        <select id="lang-select" class="pill-select">
          <option value="ko">한국어 (KO)</option>
          <option value="en">English (EN)</option>
          <option value="ja">日本語 (JA)</option>
          <option value="es">Español (ES)</option>
          <option value="zh">中文 (ZH)</option>
        </select>
        <button type="button" id="btn-sound" class="btn-icon" aria-pressed="true" title="Sound">🔊</button>
        <button type="button" id="btn-inventory" class="btn-soft" data-i18n="ui.inventory">성물 &amp; 천사 가이드</button>
        <button type="button" id="btn-codex" class="btn-soft" data-i18n="ui.codex">성경 말씀 도감</button>
        <button type="button" id="btn-help" class="btn-soft" data-i18n="ui.help">게임 방법</button>
        <button type="button" id="btn-settings" class="btn-soft" data-i18n="ui.settings">설정 · 언어</button>
      </nav>
    </div>

    <div class="hud-strip">
      <div class="hud-stat"><span data-i18n="ui.score">점수</span>: <strong id="hud-score">0</strong></div>
      <div class="hud-stat"><span data-i18n="ui.level">레벨</span>: <strong id="hud-level">1</strong></div>
      <div class="hud-stat"><span data-i18n="ui.faith">믿음</span>: <strong id="hud-faith">10</strong></div>
      <div class="hud-stat"><span data-i18n="ui.wisdom">지혜</span>: <strong id="hud-wisdom">10</strong></div>
      <div class="hud-stat"><span data-i18n="ui.mercy">긍휼</span>: <strong id="hud-mercy">10</strong></div>
      <div class="hud-stat"><span data-i18n="ui.route">에덴 분기</span>: <strong id="hud-route">탐험 중</strong></div>
      <div class="hud-stat">
        <span data-i18n="ui.activeGuide">동행 천사</span>:
        <button type="button" id="btn-hud-guide" class="guide-pill">그룹 천사</button>
      </div>
      <button type="button" id="btn-view-ending" class="btn-sunny btn-compact" hidden data-i18n="ui.viewEnding">결말 보기</button>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <!-- View 1: Cute Storybook Stage Gallery (6 Characters & 6 Genres!) -->
    <section id="view-gallery" class="gallery-view">
      <div class="storybook-hero">
        <div class="hero-portraits" aria-hidden="true">
          <img src="./assets/art/adam_eve.png" alt="">
          <img src="./assets/art/noah.png" alt="">
          <img src="./assets/art/abraham.png" alt="">
          <img src="./assets/art/moses.png" alt="">
        </div>
        <div class="hero-copy">
          <h2 id="gallery-heading" data-i18n="ui.galleryTitle">시점 · 스테이지 자유 선택</h2>
          <p class="hero-tagline" data-i18n="appTagline"></p>
          <p class="hero-hint" data-i18n="ui.galleryHint"></p>
        </div>
      </div>

      <div id="stage-gallery-grid" class="stage-gallery-grid"></div>
    </section>

    <!-- View 2: Active Multi-Genre Stage -->
    <section id="view-stage" class="stage-view" hidden>
      <div class="stage-topbar">
        <button type="button" id="btn-back-gallery" class="btn-soft" data-i18n="ui.backToGallery">동화 지도로</button>
        <div class="stage-title-cluster">
          <img id="stage-hero-img" class="stage-hero-img" src="./assets/art/adam_eve.png" alt="">
          <div>
            <span id="stage-genre-badge" class="genre-badge">⚔️ Action RPG</span>
            <h2 id="stage-title">1장. 에덴동산</h2>
          </div>
        </div>
        <div class="stage-actions">
          <button type="button" id="btn-toggle-touch" class="btn-soft" data-i18n="ui.touchControls">터치 패드</button>
          <button type="button" id="btn-retry-stage" class="btn-sunny" data-i18n="ui.retry">다시 도전</button>
        </div>
      </div>

      <div class="stage-brief">
        <p id="stage-objective" class="stage-objective"></p>
        <p id="stage-status-hud" class="stage-status-hud" aria-live="polite"></p>
      </div>

      <div class="viewport-frame">
        <canvas id="stage-canvas" width="960" height="540" aria-label="Storybook Stage Viewport"></canvas>
        <div id="stage-overlay" class="stage-overlay" hidden></div>

        <!-- Cute Storybook Dialogue Box -->
        <section id="dialogue-box" class="dialogue-box" hidden aria-labelledby="dlg-npc-name">
          <img id="dlg-portrait-img" class="dlg-portrait-img" src="./assets/art/cherubim.png" alt="">
          <div class="dlg-content">
            <h3 id="dlg-npc-name">Speaker</h3>
            <p id="dlg-npc-text" class="dlg-npc-text"></p>
            <blockquote id="dlg-npc-verse" class="dlg-npc-verse" hidden></blockquote>
            <div id="dlg-choices" class="dlg-choices"></div>
          </div>
        </section>
      </div>

      <!-- Stage-Specific Interactive Toolbar (Sim / JRPG / RTS buttons!) -->
      <div id="stage-toolbar" class="stage-toolbar" hidden></div>

      <!-- Mobile / Touch Pad -->
      <div id="touch-pad" class="touch-pad" hidden>
        <div class="dpad">
          <button type="button" class="pad-btn" data-dir="up" aria-label="Up">▲</button>
          <div class="dpad-mid">
            <button type="button" class="pad-btn" data-dir="left" aria-label="Left">◀</button>
            <button type="button" class="pad-btn" data-dir="down" aria-label="Down">▼</button>
            <button type="button" class="pad-btn" data-dir="right" aria-label="Right">▶</button>
          </div>
        </div>
        <div class="touch-actions">
          <button type="button" id="touch-dash" class="btn-soft" data-i18n="ui.dashBtn">구르기 (Shift)</button>
          <button type="button" id="touch-action" class="btn-sunny" data-i18n="ui.actionBtn">행동 / 공격 (Space)</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Choice of God v3.0 · Cute Storybook Multi-Genre RPG · <span data-i18n="ui.controlsHint"></span></p>
  </footer>

  <!-- Native Accessible Dialogs -->
  <dialog id="dlg-inventory" closedby="any" aria-labelledby="dlg-inv-title">
    <div class="dlg-header">
      <h2 id="dlg-inv-title" data-i18n="ui.inventory">성물 &amp; 천사 가이드</h2>
      <button type="button" class="dlg-close" data-close-dialog="dlg-inventory" autofocus aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <h3 data-i18n="ui.activeGuide">동행 천사</h3>
      <div id="inv-guides-list" class="cards-list"></div>
      <h3 class="mt-md" data-i18n="ui.inventory">성물</h3>
      <div id="inv-items-list" class="cards-list"></div>
    </div>
  </dialog>

  <dialog id="dlg-codex" closedby="any" aria-labelledby="dlg-codex-title">
    <div class="dlg-header">
      <h2 id="dlg-codex-title" data-i18n="ui.codex">성경 말씀 도감</h2>
      <button type="button" class="dlg-close" data-close-dialog="dlg-codex" autofocus aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div id="codex-filters" class="codex-filters"></div>
      <div id="codex-list" class="codex-list"></div>
    </div>
  </dialog>

  <dialog id="dlg-settings" closedby="any" aria-labelledby="dlg-settings-title">
    <div class="dlg-header">
      <h2 id="dlg-settings-title" data-i18n="ui.settings">설정 · 언어</h2>
      <button type="button" class="dlg-close" data-close-dialog="dlg-settings" autofocus aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <h3 data-i18n="ui.language">언어 변경</h3>
      <div class="lang-grid">
        <button type="button" class="lang-card" data-set-lang="ko">한국어<small>Korean</small></button>
        <button type="button" class="lang-card" data-set-lang="en">English<small>영어</small></button>
        <button type="button" class="lang-card" data-set-lang="ja">日本語<small>일본어</small></button>
        <button type="button" class="lang-card" data-set-lang="es">Español<small>스페인어</small></button>
        <button type="button" class="lang-card" data-set-lang="zh">中文<small>중국어</small></button>
      </div>
      <div class="settings-row">
        <button type="button" id="dlg-sound-toggle" class="btn-soft"></button>
        <button type="button" id="dlg-reset-btn" class="btn-danger" data-i18n="ui.resetProgress"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-help" closedby="any" aria-labelledby="dlg-help-title">
    <div class="dlg-header">
      <h2 id="dlg-help-title" data-i18n="ui.help">게임 방법</h2>
      <button type="button" class="dlg-close" data-close-dialog="dlg-help" autofocus aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <p data-i18n="ui.helpBody1"></p>
      <p data-i18n="ui.helpBody2"></p>
      <p data-i18n="ui.helpBody3"></p>
      <p data-i18n="ui.helpBody4"></p>
      <div class="dlg-actions">
        <button type="button" class="btn-sunny" data-close-dialog="dlg-help" data-i18n="ui.confirm">확인</button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-result" closedby="none" aria-labelledby="dlg-result-title">
    <div class="dlg-header">
      <h2 id="dlg-result-title">Result</h2>
    </div>
    <div class="dlg-body">
      <p id="res-stars" class="res-stars"></p>
      <p id="res-summary"></p>
      <blockquote id="res-verse" class="dlg-npc-verse"></blockquote>
      <div id="res-unlocks" class="res-unlocks"></div>
      <div class="dlg-actions">
        <button type="button" id="btn-res-map" class="btn-soft" data-i18n="ui.backToGallery"></button>
        <button type="button" id="btn-res-retry" class="btn-soft" data-i18n="ui.retry"></button>
        <button type="button" id="btn-res-next" class="btn-sunny" autofocus data-i18n="ui.nextStage"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-ending" closedby="any" aria-labelledby="dlg-ending-title">
    <div class="dlg-header">
      <h2 id="dlg-ending-title" data-i18n="ui.endingTitle">대서사의 결말</h2>
      <button type="button" class="dlg-close" data-close-dialog="dlg-ending" autofocus aria-label="Close">✕</button>
    </div>
    <div class="dlg-body ending-body">
      <img id="ending-art" class="ending-art" src="./assets/art/adam_eve.png" alt="">
      <h3 id="ending-headline"></h3>
      <p id="ending-desc"></p>
      <div id="ending-stats" class="ending-stats"></div>
      <div class="dlg-actions">
        <button type="button" class="btn-sunny" data-close-dialog="dlg-ending" data-i18n="ui.endingClose"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
